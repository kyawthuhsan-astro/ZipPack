name: Release

# Push a tag such as v1.0.1 (equal to <Version> in ZipPackNet.csproj) to publish a release.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write # create the GitHub release and upload the Velopack packages

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      - name: Check the tag against <Version>
        shell: pwsh
        run: |
          [xml]$project = Get-Content ZipPackNet/ZipPackNet.csproj
          $declared = ($project.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          if ("v$declared" -ne '${{ github.ref_name }}') { throw "Tag ${{ github.ref_name }} does not match <Version>$declared</Version>." }
          $velopack = $project.SelectSingleNode("//PackageReference[@Include='Velopack']").GetAttribute('Version')
          "VELOPACK_VERSION=$velopack" >> $env:GITHUB_ENV

      - name: Install the Velopack CLI (same version as the package)
        run: dotnet tool install -g vpk --version ${{ env.VELOPACK_VERSION }}

      - name: Download the previous release (for delta updates)
        run: vpk download github --repoUrl ${{ github.server_url }}/${{ github.repository }} -o Releases --token ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true # the first release has nothing to download

      - name: Test, publish and pack
        shell: pwsh
        run: ./build-release.ps1 -UpdateFeedUrl ${{ github.server_url }}/${{ github.repository }}

      - name: Upload to GitHub Releases
        run: >
          vpk upload github --repoUrl ${{ github.server_url }}/${{ github.repository }}
          --publish --releaseName "ZipPack ${{ github.ref_name }}"
          --tag ${{ github.ref_name }} --token ${{ secrets.GITHUB_TOKEN }} -o Releases
